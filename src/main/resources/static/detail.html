<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
    <div class="logo">FASHION</div>
    <div class="menu">
        <a href="index.html">Trang chủ</a>
        <a href="product.html">Nam</a>
        <a href="product.html">Nữ</a>
        <a href="product.html">Trẻ em</a>
    </div>
    <div class="search">
        <input type="text" placeholder="Tìm kiếm sản phẩm...">
    </div>
    <a href="cart.html" class="cart">Giỏ hàng</a>
</div>

<div class="detail-page">
    <div class="detail-image">
        <img src="https://picsum.photos/600/760?random=30">
    </div>

    <div class="detail-info">
        <h1>Áo thun nam basic</h1>
        <p class="detail-price">299.000đ</p>

        <p class="detail-desc">
            Áo thun chất liệu mềm, thoáng mát, phù hợp mặc đi học, đi chơi và đi làm.
        </p>

        <div class="option">
            <h4>Chọn size</h4>
            <button>S</button>
            <button>M</button>
            <button>L</button>
            <button>XL</button>
        </div>

        <div class="option">
            <h4>Chọn màu</h4>
            <button>Đen</button>
            <button>Trắng</button>
            <button>Xanh</button>
        </div>

        <div class="quantity">
            <span>Số lượng:</span>
            <input type="number" value="1" min="1">
        </div>

        <button class="btn-buy">Thêm vào giỏ hàng</button>
        <button class="btn-outline">Mua ngay</button>
    </div>
</div>

<div class="footer">
    © 2026 Fashion Shop
</div>

</body>
</html>
