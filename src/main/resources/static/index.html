<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HA Fashion Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#faf7f3;color:#111}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .wrap{max-width:1280px;margin:auto;padding:0 24px}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .soft-card{background:white;border:1px solid #e8e1da;border-radius:24px;box-shadow:0 10px 30px rgba(17,17,17,.04)}
    .input-ui{width:100%;border:1px solid #e5e0dc;border-radius:16px;padding:14px 18px;font-size:16px;outline:none;background:#fff}
    .input-ui:focus{border-color:#991b1b;box-shadow:0 0 0 4px rgba(153,27,27,.08)}
    .btn-primary{width:100%;background:#991b1b;color:white;border-radius:999px;padding:14px 18px;font-weight:700;transition:.2s}
    .btn-primary:hover{background:#7f1d1d}
  </style>
</head>
<body>
  <div id="app"></div>

<script>
const API_BASE = "http://localhost:8080/api";

const fallbackImages = [
  "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?q=80&w=900&auto=format&fit=crop",
  "https://images.unsplash.com/photo-1434389677669-e08b4cac3105?q=80&w=900&auto=format&fit=crop",
  "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=900&auto=format&fit=crop",
  "https://images.unsplash.com/photo-1485968579580-b6d095142e6e?q=80&w=900&auto=format&fit=crop",
  "https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=900&auto=format&fit=crop",
  "https://images.unsplash.com/photo-1543076447-215ad9ba6923?q=80&w=900&auto=format&fit=crop",
  "https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=900&auto=format&fit=crop",
  "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?q=80&w=900&auto=format&fit=crop"
];

let page = "home";
let products = [];
let allProducts = [];
let categories = [];
let brands = [];
let selectedProduct = null;
let selectedCategoryId = null;
let searchKeyword = "";
let authMode = "login";

function setRoute(nextPage, params = {}){
  const url = new URL(window.location.href);
  url.searchParams.set("page", nextPage);

  if(params.categoryId) url.searchParams.set("categoryId", params.categoryId);
  else url.searchParams.delete("categoryId");

  if(params.productId) url.searchParams.set("productId", params.productId);
  else url.searchParams.delete("productId");

  if(params.keyword) url.searchParams.set("keyword", params.keyword);
  else url.searchParams.delete("keyword");

  history.pushState({}, "", url);
}

function readRoute(){
  const params = new URLSearchParams(window.location.search);
  page = params.get("page") || "home";
  selectedCategoryId = params.get("categoryId") ? Number(params.get("categoryId")) : null;
  searchKeyword = params.get("keyword") || "";
  return {
    page,
    categoryId: selectedCategoryId,
    productId: params.get("productId") ? Number(params.get("productId")) : null,
    keyword: searchKeyword
  };
}

function icon(n,c="w-6 h-6"){
  return `<i data-lucide="${n}" class="${c}"></i>`;
}

function formatPrice(price){
  if(price === null || price === undefined || price === "") return "Liên hệ";
  return Number(price).toLocaleString("vi-VN") + "đ";
}

function getProductImg(p, index=0){
  if(p.imageUrl) return p.imageUrl;
  if(p.images && p.images.length > 0) return p.images[0].imageUrl;
  return fallbackImages[index % fallbackImages.length];
}

function getBrandName(p){
  return p.brand?.brandName || p.brandName || "HA FASHION";
}

function header(){return `<header class="sticky top-0 z-50 bg-white border-b shadow-sm">
  <div class="bg-black text-white text-xs"><div class="wrap py-2 flex justify-between"><span>Freeship đơn từ 999.000đ</span><span>Hotline: 0900 888 999 · Đổi trả 7 ngày</span></div></div>
  <div class="wrap py-4 flex items-center gap-7">
    <button onclick="go('home')" class="serif text-3xl lg:text-4xl tracking-[.22em] font-bold whitespace-nowrap">HA FASHION</button>
    <nav class="hidden lg:flex gap-7 font-semibold text-base flex-1">
      <button onclick="go('home')" class="hover:text-red-800">Trang chủ</button>
      <button onclick="go('shop')" class="hover:text-red-800">Sản phẩm</button>
      <button onclick="go('promo')" class="hover:text-red-800">Khuyến mãi</button>
      <button onclick="go('store')" class="hover:text-red-800">Cửa hàng</button>
    </nav>
    <div class="hidden md:flex w-[360px] rounded-full border bg-neutral-50 px-4 py-3 items-center gap-3">${icon("search","w-5 h-5")}<input id="searchInput" onkeydown="searchEnter(event)" class="bg-transparent outline-none flex-1" placeholder="Tìm sản phẩm..." /></div>
    <div class="flex gap-5 items-center">${icon("heart")}${icon("shopping-bag")}<button onclick="go('auth')" title="Tài khoản">${icon("user")}</button></div>
  </div>
</header>`}

function footer(){return `<footer class="mt-16 bg-black text-white"><div class="wrap py-12 grid md:grid-cols-4 gap-8"><div><h2 class="serif text-3xl tracking-widest font-bold">HA FASHION</h2><p class="mt-4 text-neutral-300">Thời trang nữ thanh lịch, hiện đại.</p></div><div><b>Danh mục</b><p class="mt-3 text-neutral-300">Đầm nữ</p><p>Áo sơ mi</p><p>Blazer</p></div><div><b>Hỗ trợ</b><p class="mt-3">Đổi trả</p><p>Chọn size</p><p>Theo dõi đơn</p></div><div><b>Liên hệ</b><p class="mt-3">Hà Nội, Việt Nam</p><p>0900 888 999</p></div></div></footer>`}

function hero(){return `<section class="relative h-[560px] overflow-hidden bg-black"><img class="absolute inset-0 w-full h-full object-cover opacity-70" src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1600&auto=format&fit=crop"><div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/30 to-transparent"></div><div class="wrap relative h-full flex items-center text-white"><div class="max-w-2xl"><p class="uppercase tracking-[.35em] text-red-200 font-semibold">HA Fashion</p><h1 class="serif text-7xl leading-tight mt-4">Summer Collection 2026</h1><p class="text-xl mt-5 text-white/85">Đầm, blazer và áo sơ mi thanh lịch cho mùa mới.</p><button onclick="go('shop')" class="mt-8 rounded-full bg-white text-black px-8 py-4 font-bold">Khám phá ngay</button></div></div></section>`}

function categoryGrid(){
  const list = categories.length ? categories : [];
  return `<section class="wrap py-12"><div class="bg-white border rounded-3xl overflow-hidden shadow-sm"><h2 class="px-6 py-5 border-b text-xl font-bold uppercase text-neutral-700">Danh mục nổi bật</h2><div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6">${list.map((c,i)=>`<button onclick="filterCategory(${c.categoryId})" class="h-40 border-r border-b hover:bg-red-50 flex flex-col items-center justify-center gap-3"><img class="w-20 h-20 rounded-full object-cover" src="${fallbackImages[i % fallbackImages.length]}"><span class="font-semibold">${c.categoryName}</span></button>`).join("")}</div></div></section>`
}

function card(p,index){return `<div onclick="detail(${p.productId})" class="cursor-pointer bg-white border rounded-2xl shadow-sm hover:shadow-xl transition overflow-hidden"><div class="relative aspect-[3/4]"><img class="w-full h-full object-cover" src="${getProductImg(p,index)}">${p.status === "ACTIVE" ? `
  <span class="absolute left-3 top-3 bg-red-800 text-white rounded-full px-3 py-1 text-xs font-bold">
    NEW
  </span>
` : ""}<button class="absolute right-3 top-3 bg-white rounded-full p-2 shadow">${icon("heart","w-5 h-5")}</button></div><div class="p-4"><p class="text-xs tracking-widest text-neutral-500">${getBrandName(p)}</p><h3 class="line-clamp-2 min-h-12 font-semibold mt-1">${p.productName}</h3><div class="mt-3 flex justify-between items-end"><b class="text-red-800 text-xl">${formatPrice(p.basePrice)}</b><span class="text-xs text-neutral-500">Còn hàng</span></div></div></div>`}

function productGrid(list = products){
  if(!list.length) return `<div class="bg-white rounded-3xl border p-10 text-center text-neutral-500">Chưa có sản phẩm để hiển thị.</div>`;
  return `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">${list.map(card).join("")}</div>`
}

function home(){return header()+hero()+categoryGrid()+`<section class="wrap py-10"><div class="mb-7 flex justify-between items-end"><div><p class="text-red-800 tracking-widest uppercase font-bold">Sản phẩm nổi bật</p><h2 class="serif text-5xl">Best Sellers</h2></div><button onclick="go('shop')" class="border rounded-full px-6 py-3 bg-white font-semibold">Xem tất cả</button></div>${productGrid(products.slice(0,8))}</section>`+footer()}

function shop(){return header()+`<main class="wrap py-12 grid lg:grid-cols-[260px_1fr] gap-7"><aside class="bg-white border rounded-3xl overflow-hidden shadow-sm h-fit sticky top-36"><h2 class="px-5 py-4 border-b font-bold text-lg uppercase">Bộ lọc</h2><button onclick="clearCategory()" class="w-full p-4 border-b text-left hover:bg-red-50 ${selectedCategoryId===null?'bg-red-50 text-red-800 font-bold':''}">Tất cả sản phẩm</button>${categories.map((c,i)=>`<button onclick="filterCategory(${c.categoryId})" class="w-full flex items-center gap-3 p-4 border-b text-left hover:bg-red-50 ${selectedCategoryId===c.categoryId?'bg-red-50 text-red-800 font-bold':''}"><img class="w-12 h-12 rounded-full object-cover" src="${fallbackImages[i % fallbackImages.length]}"><span>${c.categoryName}</span></button>`).join("")}</aside><section><div class="mb-7 flex justify-between items-end gap-4"><div><p class="text-red-800 tracking-widest uppercase font-bold">Shop</p><h1 class="serif text-5xl">Danh sách sản phẩm</h1><p class="text-neutral-600 mt-3">Chọn danh mục bên trái để chuyển nhanh sang nhóm sản phẩm khác.</p></div><select onchange="sortProducts(this.value)" class="bg-white border rounded-full px-5 py-3"><option value="default">Sắp xếp mặc định</option><option value="asc">Giá tăng dần</option><option value="desc">Giá giảm dần</option></select></div>${productGrid()}</section></main>`+footer()}

function detailPage(){const p=selectedProduct || products[0]; if(!p) return header()+`<main class="wrap py-20">Không tìm thấy sản phẩm.</main>`+footer(); return header()+`<main class="wrap py-12 grid lg:grid-cols-2 gap-10"><div class="grid grid-cols-2 gap-4"><img class="col-span-2 h-[560px] w-full object-cover rounded-3xl" src="${getProductImg(p,0)}"><img class="h-56 w-full object-cover rounded-3xl" src="${getProductImg(p,1)}"><img class="h-56 w-full object-cover rounded-3xl" src="${getProductImg(p,2)}"></div><div class="bg-white rounded-3xl border shadow-sm p-9 h-fit sticky top-36"><p class="text-red-800 uppercase tracking-widest font-bold">${getBrandName(p)}</p><h1 class="serif text-5xl mt-3">${p.productName}</h1><p class="mt-4">⭐ 4.9 · Đánh giá tốt · Trạng thái: ${p.status || "ACTIVE"}</p><div class="mt-7"><b class="text-4xl text-red-800">${formatPrice(p.basePrice)}</b></div><p class="mt-6 text-neutral-600">${p.description || "Thiết kế thanh lịch, chất liệu cao cấp, phù hợp đi làm, dự tiệc và gặp gỡ khách hàng."}</p><h3 class="font-bold mt-7 mb-3">Kích thước</h3><div class="flex gap-3">${["S","M","L","XL"].map(s=>`<button class="border rounded-xl px-6 py-3 hover:border-red-800">${s}</button>`).join("")}</div><div class="mt-8 flex gap-4"><button onclick="addToCart(${p.productId})" class="flex-1 bg-black text-white rounded-full py-4 font-bold">Thêm vào giỏ</button><button class="flex-1 bg-red-800 text-white rounded-full py-4 font-bold">Mua ngay</button></div></div></main>`+footer()}

function promo(){return header()+`<main class="wrap py-14"><section class="rounded-3xl bg-gradient-to-r from-red-900 to-red-600 text-white p-12"><p class="uppercase tracking-widest">Ưu đãi tháng này</p><h1 class="serif text-6xl mt-3">Khuyến mãi hot</h1><p class="text-xl mt-4">Săn sale cho các sản phẩm thời trang nữ mới nhất.</p><button onclick="go('shop')" class="mt-7 bg-white text-red-800 rounded-full px-8 py-4 font-bold">Mua ngay</button></section><h2 class="serif text-4xl mt-12 mb-6">Sản phẩm đang bán</h2>${productGrid(products.slice(0,8))}</main>`+footer()}

function store(){return header()+`<main class="wrap py-14"><p class="text-red-800 uppercase tracking-widest font-bold">HA Fashion Store</p><h1 class="serif text-5xl mt-2">Hệ thống cửa hàng</h1><p class="text-neutral-600 mt-3">Tìm chi nhánh gần bạn, xem giờ mở cửa và dịch vụ hỗ trợ.</p><div class="grid md:grid-cols-2 lg:grid-cols-4 gap-5 mt-8">${["Cầu Giấy, Hà Nội","Hoàn Kiếm, Hà Nội","Quận 1, TP.HCM","Hải Châu, Đà Nẵng"].map((x,i)=>`<div class="bg-white border rounded-3xl p-6 shadow-sm"><h3 class="text-xl font-bold">HA Fashion ${i+1}</h3><p class="mt-3 flex gap-2">${icon("map-pin","w-5 h-5")} ${x}</p><p class="mt-2 flex gap-2">${icon("clock","w-5 h-5")} 08:30 - 22:00</p><button class="mt-5 bg-red-800 text-white rounded-full px-5 py-2">Chỉ đường</button></div>`).join("")}</div></main>`+footer()}

function authPage(){
  const user = JSON.parse(localStorage.getItem("ha_user") || "null");
  if(user){
    return header()+`<main class="wrap py-14"><div class="soft-card p-8 max-w-xl mx-auto text-center"><h1 class="serif text-4xl">Xin chào, ${user.fullname || user.email}</h1><p class="mt-4 text-neutral-600">Email: ${user.email}</p><p class="mt-2 text-neutral-600">Vai trò: ${user.role}</p><button onclick="logout()" class="mt-7 bg-black text-white rounded-full px-8 py-3 font-bold">Đăng xuất</button></div></main>`+footer();
  }

  const isLogin = authMode === "login";
  return header()+`<main class="wrap py-12 lg:py-16">
    <div class="grid lg:grid-cols-[1fr_540px] gap-10 items-center">
      <section class="pr-4">
        <p class="text-red-800 tracking-[.18em] uppercase font-bold text-base mb-5">HA FASHION ACCOUNT</p>
        <h1 class="serif text-5xl lg:text-6xl leading-tight mb-5">${isLogin ? "Chào mừng bạn quay lại" : "Tạo tài khoản mua hàng"}</h1>
        <p class="text-neutral-700 text-lg lg:text-xl max-w-2xl">Quản lý đơn hàng, lưu sản phẩm yêu thích và nhận voucher cá nhân.</p>
      </section>

      <section class="soft-card p-7 lg:p-8">
        <h2 class="serif text-4xl text-center mb-7">${isLogin ? "Đăng nhập" : "Đăng ký"}</h2>

        ${isLogin ? `
          <div class="space-y-4">
            <input id="loginEmail" class="input-ui" placeholder="Email hoặc số điện thoại">
            <input id="loginPassword" type="password" class="input-ui" placeholder="Mật khẩu">
            <button onclick="login()" class="btn-primary">Đăng nhập</button>
          </div>
          <p class="text-center mt-6 text-base">Chưa có tài khoản? <button onclick="switchAuth('register')" class="text-red-800 font-bold">Đăng ký ngay</button></p>
        ` : `
          <div class="space-y-4">
            <input id="regFullname" class="input-ui" placeholder="Họ và tên">
            <input id="regEmail" class="input-ui" placeholder="Email hoặc số điện thoại">
            <input id="regPassword" type="password" class="input-ui" placeholder="Mật khẩu">
            <input id="regConfirm" type="password" class="input-ui" placeholder="Nhập lại mật khẩu">
            <button onclick="register()" class="btn-primary">Tạo tài khoản</button>
          </div>
          <p class="text-center mt-6 text-base">Đã có tài khoản? <button onclick="switchAuth('login')" class="text-red-800 font-bold">Đăng nhập</button></p>
        `}
        <p id="authMsg" class="text-center mt-4 text-red-800 font-semibold text-sm"></p>
      </section>
    </div>
  </main>`+footer();
}

function switchAuth(type){
  authMode = type;
  render();
}

async function login(){
  const body = {
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPassword').value
  };

  const res = await fetch(`${API_BASE}/auth/login`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if(!res.ok){
    document.getElementById('authMsg').innerText = data.message || 'Đăng nhập thất bại';
    return;
  }

  localStorage.setItem('ha_user', JSON.stringify(data));
  go('auth');
}

async function register(){
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;

  if(password !== confirm){
    document.getElementById('authMsg').innerText = "Mật khẩu nhập lại không khớp";
    return;
  }

  const body = {
    fullname: document.getElementById('regFullname').value,
    email: document.getElementById('regEmail').value,
    phone: "",
    password: password,
    role: "USER",
    address: "",
    status: "ACTIVE"
  };

  const res = await fetch(`${API_BASE}/auth/register`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if(!res.ok){
    document.getElementById('authMsg').innerText = data.message || 'Đăng ký thất bại';
    return;
  }

  localStorage.setItem('ha_user', JSON.stringify(data));
  go('auth');
}

function logout(){localStorage.removeItem('ha_user'); go('auth');}

async function fetchJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("API lỗi: " + url);
  return res.json();
}

async function loadInitialData(){
  try{
    const [productData, categoryData, brandData] = await Promise.all([
      fetchJson(`${API_BASE}/products`),
      fetchJson(`${API_BASE}/categories`),
      fetchJson(`${API_BASE}/brands`).catch(()=>[])
    ]);

    allProducts = productData.filter(p => p.status === "ACTIVE");
    products = allProducts;
    categories = categoryData;
    brands = brandData;

    await applyRoute();
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = `<div class="p-10 text-center"><h1 class="text-3xl font-bold text-red-800">Không kết nối được backend</h1><p class="mt-3">Kiểm tra Spring Boot đang chạy ở cổng 8080 và API /api/products hoạt động.</p></div>`;
  }
}

async function applyRoute(){
  const route = readRoute();

  if(route.page === "shop"){
    if(route.categoryId){
      try{ const data = await fetchJson(`${API_BASE}/products/category/${route.categoryId}`);
                products = data.filter(p => p.status === "ACTIVE"); }
      catch(e){ products = allProducts.filter(p => p.category?.categoryId === route.categoryId); }
    }else if(route.keyword){
      try{ const data = await fetchJson(`${API_BASE}/products/search?keyword=${encodeURIComponent(route.keyword)}`);
        products = data.filter(p => p.status === "ACTIVE"); }
      catch(e){ products = allProducts.filter(p => (p.productName || "").toLowerCase().includes(route.keyword.toLowerCase())); }
    }else{
      products = allProducts;
    }
  }

  if(route.page === "detail" && route.productId){
    try{ selectedProduct = await fetchJson(`${API_BASE}/products/${route.productId}`); }
    catch(e){ selectedProduct = allProducts.find(p => p.productId === route.productId); }
  }

  render();
}

async function detail(id){
  setRoute("detail", {productId:id});
  await applyRoute();
  scrollTo(0,0);
}

async function filterCategory(categoryId){
  setRoute("shop", {categoryId});
  await applyRoute();
  scrollTo(0,0);
}

async function clearCategory(){
  setRoute("shop");
  await applyRoute();
  scrollTo(0,0);
}

async function searchEnter(e){
  if(e.key !== 'Enter') return;
  const keyword = e.target.value.trim();
  setRoute("shop", {keyword});
  await applyRoute();
  scrollTo(0,0);
}

function sortProducts(type){
  if(type === 'asc') products.sort((a,b)=>(a.basePrice||0)-(b.basePrice||0));
  if(type === 'desc') products.sort((a,b)=>(b.basePrice||0)-(a.basePrice||0));
  render();
}

function addToCart(productId){
  alert("Chức năng giỏ hàng sẽ nối API variant/cart sau. Product ID: " + productId);
}

async function go(p){
  setRoute(p);
  await applyRoute();
  scrollTo(0,0);
}

window.addEventListener("popstate", applyRoute);

function render(){
  document.getElementById('app').innerHTML = page==='home'?home():page==='shop'?shop():page==='detail'?detailPage():page==='promo'?promo():page==='store'?store():authPage();
  lucide.createIcons();
}

loadInitialData();
</script>

<div id="switchPanel" class="fixed bottom-6 right-6 z-50">
  <div class="flex gap-2">

    <button onclick="goShop()"
      class="px-5 py-2 rounded-full font-bold bg-black text-white">
      Shop
    </button>

    <button onclick="goStaff()"
      class="px-5 py-2 rounded-full font-bold bg-neutral-200">
      Staff
    </button>

    <button onclick="goAdmin()"
      class="px-5 py-2 rounded-full font-bold bg-red-800 text-white">
      Admin
    </button>

  </div>
</div>

<script>
function goShop(){
  window.location.href = "/index.html";
}

function goAdmin(){
  window.location.href = "/admin.html";
}

function goStaff(){
  window.location.href = "/staff.html";
}
</script>

</body>
</html>
